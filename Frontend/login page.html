<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url(../Login/img6.jpg);
            background-size: cover;
            background-position: center;
        }
        .wrapper {
            width: 450px;
            padding: 80px 40px;
            border: 2px solid #dbd6d6;
            background: transparent;
            backdrop-filter: blur(30px);
            box-shadow: 0 0 10px #f9f8f8;
            border-radius: 10px;
        }
        .wrapper h1 {
            font-size: 36px;
            color: #6d0571;
            font-weight: bolder;
            text-align: center;
            text-transform: uppercase;
        }
        .wrapper .inputBox {
            position: relative;
            height: 50px;
            width: 100%;
            margin: 20px 0;
        }
        .inputBox input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: 2px solid #000000;
            outline: none;
            border-radius: 40px;
            font-size: 16px;
            color: #000000;
            padding: 20px;
            transition: all 0.4s;
        }
        .inputBox input::placeholder {
            color: #000000;
        }
        .inputBox input:focus {
            border: 2px solid rgba(245, 249, 252, 0.934);
        }
        .remember_forget {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin: 15px 15px 20px;
        }
        .remember_forget label input {
            color: #fff;
            margin-right: 3px;
        }
        .remember_forget a {
            color: #000000;
            text-decoration: none;
        }
        .remember_forget a:hover {
            text-decoration: underline;
            color: #fff;
        }
        .wrapper .btn {
            width: 100%;
            height: 45px;
            background: transparent;
            box-shadow: 0 0 10px #6d0571;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            background-image: linear-gradient(to right, #f4c4e2 0%, #6d0571 75%);
            color: whitesmoke;
            outline: none;
            border: none;
            border-radius: 40px;
            transition: 0.5s;
            transition: all 0.2s;
            transform: translateY(-5px);
        }
        .wrapper .btn:hover {
            background-position: left center;
            opacity: 50%;
        }
        .wrapper .btn:active {
            margin: 20px 0 15px;
            font-size: 14.6px;
            text-align: center;
        }
        .register_link p a {
            color: #000000;
            text-transform: uppercase;
            font-weight: bold;
            text-decoration: none;
        }
        .register_link p a:hover {
            text-decoration: underline;
            color: #6d0571;
        }
        .checkbox {
            border: 1px solid #6d0571;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <form id="login-form">
            <h1>Login</h1>
            <div class="inputBox">
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="inputBox">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <div class="remember_forget"> 
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="forgot pswd.html">Forgot password?</a>
            </div>
            <button type="submit" class="btn">Login</button>
            <div class="register_link">
                <p><br>Don't have an account?<a href="registration.html"> Register here</a></p>
            </div>
        </form>
    </div>

    <script>
        // Handle form submission
        document.getElementById('login-form').addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevent the default form submission

            // Get the values from the input fields
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Create an object to send to the backend
            const loginData = {
                username: username,
                password: password
            };

            // Make a POST request to the backend login route
            fetch('http://localhost:5000/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(loginData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Redirect the user to the dashboard or another page on successful login
                    window.location.href = 'home.html';  // Redirect to home.html on successful login
                    // Replace with the correct page
                } else {
                    // Handle login failure
                    alert('Login failed: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while logging in.');
            });
        });
    </script>
</body>
</html>
