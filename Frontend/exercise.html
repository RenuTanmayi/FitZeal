<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise Recommendation</title>
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: white;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      background-color:#b31166;
      color: white;
      text-align: center;
      padding: 40px 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .selection {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 40px 0;
    }

    .buttons button {
      padding: 15px 25px;
      font-size: 1.1rem;
      background-color: #b31166;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .buttons button:hover {
      background-color: #77346a;
      transform: translateY(-4px);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    #exercise-list {
      display: none;
      width: 100%;
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      margin-top: 30px;
    }

    #exercise-list h2 {
  margin-bottom: 20px;
}


    .exercise-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #ddd;
    }

    .exercise-item:last-child {
      border-bottom: none;
    }

    .exercise-item iframe {
      width: 350px;
      height: 200px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .exercise-item div {
      flex: 1;
      text-align: left;
      padding-left: 20px;
    }

    .exercise-item h3 {
      font-size: 1.6rem;
      color: #b31166;
      margin-bottom: 10px;
    }

    .exercise-item p {
      font-size: 1.1rem;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .exercise-item strong {
      font-size: 1.2rem;
    }

    footer {
      background-color: #b31166;
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.1);
    }

    footer p {
      font-size: 1rem;
    }

    @media (max-width: 768px) {
      .exercise-item {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .exercise-item iframe {
        width: 100%;
        height: auto;
      }

      .buttons button {
        font-size: 1rem;
        padding: 12px 20px;
      }
    }

  </style>
</head>
<body>
  <header>
    <h1>Exercise Recommendation</h1>
    <p>Choose your desired intensity and start working out!</p>
  </header>

  <main>
    <section class="selection">
      <h2>Choose Intensity Level: </h2>
      <div class="buttons">
        <button onclick="showExercises('intense')">Intense</button>
        <button onclick="showExercises('moderate')">Moderate</button>
        <button onclick="showExercises('light')">Light</button>
      </div>
    </section>

    <section id="exercise-list">
      <h2>Recommended Exercises</h2>
      <div id="exercises"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 Exercise Recommendation</p>
  </footer>

  <script>
    const exercises = {
      intense: [
        { name: "Burpees", description: "A full-body high-intensity exercise.", duration: "30 seconds per set", video: "https://www.youtube.com/embed/dZgVxmf6jkA" },
        { name: "Deadlifts", description: "Strength training for your back and legs.", duration: "5 sets of 10 reps", video: "https://www.youtube.com/embed/ytGaGIn3SjE" },
        { name: "Sprints", description: "Short bursts of running at maximum effort.", duration: "5 rounds of 30 seconds", video: "https://www.youtube.com/embed/2YogM9wXAJg" },
        { name: "Weighted Squats", description: "Build lower body strength.", duration: "3 sets of 12 reps", video: "https://www.youtube.com/embed/0LaoF369azs" },
        { name: "Pull-ups", description: "Strengthens upper body and grip strength.", duration: "3 sets to failure", video: "https://www.youtube.com/embed/x_W7c-BRU8w" },
        { name: "Kettlebell Swings", description: "Explosive full-body workout.", duration: "4 sets of 20 swings", video: "https://www.youtube.com/embed/GJ4nZVKf0II" },
        { name: "Push Press", description: "Combination of strength and cardio.", duration: "3 sets of 15 reps", video: "https://www.youtube.com/embed/9-DlYB4vO4U" },
        { name: "Box Jumps", description: "Explosive plyometric exercise.", duration: "3 sets of 12 reps", video: "https://www.youtube.com/embed/3pEuCTgTif4" },
        { name: "Battle Ropes", description: "Intense upper body cardio.", duration: "3 rounds of 1 minute", video: "https://www.youtube.com/embed/r2Rzaf7SaGg" },
        { name: "Clean and Jerk", description: "High-intensity Olympic lift.", duration: "5 sets of 5 reps", video: "https://www.youtube.com/embed/wR5k7OFliro"}
      ],
      moderate: [
        { name: "Jogging", description: "A steady-paced run for endurance.", duration: "20 minutes", video: "https://www.youtube.com/embed/3XbfW90grUk" },
        { name: "Push-ups", description: "Builds upper body strength.", duration: "3 sets of 15 reps", video: "https://www.youtube.com/embed/IODxDxX7oi4" },
        { name: "Lunges", description: "Improves leg strength and balance.", duration: "3 sets of 10 reps per leg", video: "https://www.youtube.com/embed/A9_nFLKhIB0" },
        { name: "Plank", description: "Core-strengthening isometric exercise.", duration: "3 sets of 1 minute", video: "https://www.youtube.com/embed/pSHjTRCQxIw" },
        { name: "Jumping Jacks", description: "Full-body aerobic exercise.", duration: "3 sets of 2 minutes", video: "https://www.youtube.com/embed/yDSMdd8hiFg" },
        { name: "Mountain Climbers", description: "High-intensity cardio exercise.", duration: "3 sets of 30 seconds", video: "https://www.youtube.com/embed/cnyTQDSE884" },
        { name: "Side Plank", description: "Targets obliques and core.", duration: "3 sets of 30 seconds per side", video: "https://www.youtube.com/embed/9dNL_mtObGQ" }
      ],
      light: [
        { name: "Neck Stretches", description: "Relieves tension in the neck.", duration: "10 minutes", video: "https://www.youtube.com/embed/PL6g8hXqCVE" },
        { name: "Side Stretches", description: "Gentle stretches for flexibility.", duration: "3 sets of 20 seconds", video: "https://www.youtube.com/embed/wnlcuZ0mJSU" },
        { name: "Cat-Cow Stretch", description: "Relaxes the spine and back muscles.", duration: "5 minutes", video: "https://www.youtube.com/embed/Ci5hPz9T1gw" },
        { name: "Heel and Toe Raises", description: "Strengthens calves and improves posture.", duration: "3 sets of 15 reps", video: "https://www.youtube.com/embed/QLR-3R3GV3Y" },
        { name: "Ankle Circles", description: "Improves ankle mobility.", duration: "2 minutes each ankle", video: "https://www.youtube.com/embed/FBDxKwrJmQQ" },
        { name: "Wrist Stretches", description: "Relieves tension in wrists and forearms.", duration: "5 minutes", video: "https://www.youtube.com/embed/rsRuItFgmSQ" },
        { name: "Seated Leg Extensions", description: "Strengthens quadriceps while seated.", duration: "3 sets of 15 reps", video: "https://www.youtube.com/embed/4bSCM9_0u6A" }
      ]
    };

    function showExercises(level) {
      const exerciseList = document.getElementById("exercise-list");
      const exercisesContainer = document.getElementById("exercises");
      exercisesContainer.innerHTML = "";

      const selectedExercises = exercises[level];
      selectedExercises.forEach(exercise => {
        const exerciseItem = document.createElement("div");
        exerciseItem.classList.add("exercise-item");
        exerciseItem.innerHTML = `
          <iframe width="380" height="250" src="${exercise.video}" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          <div>
            <h3>${exercise.name}</h3>
            <p>${exercise.description}</p>
            <p><strong>Duration:</strong> ${exercise.duration}</p>
          </div>
        `;
        exercisesContainer.appendChild(exerciseItem);
      });

      exerciseList.style.display = 'block'; // Show the exercise list
    }
  </script>
</body>
</html>
