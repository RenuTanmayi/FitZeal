<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url(../Login/img6.jpg);
            background-size: cover;
            background-position: center;
        }
        .wrapper {
            width: 450px;
            padding: 80px 40px;
            border: 2px solid #dbd6d6;
            background: transparent;
            backdrop-filter: blur(30px);
            box-shadow: 0 0 10px #f9f8f8;
            border-radius: 10px;
        }
        .wrapper h1 {
            font-size: 36px;
            color: #6d0571;
            font-weight: bolder;
            text-align: center;
            text-transform: uppercase;
        }
        .wrapper .inputBox {
            position: relative;
            height: 50px;
            width: 100%;
            margin: 20px 0;
        }
        .inputBox input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: 2px solid #000000;
            outline: none;
            border-radius: 40px;
            font-size: 16px;
            color: #000000;
            padding: 20px;
            transition: all 0.4s;
        }
        .inputBox input::placeholder {
            color: #000000;
        }
        .inputBox input:focus {
            border: 2px solid rgba(245, 249, 252, 0.934);
        }
        .wrapper .btn {
            width: 100%;
            height: 45px;
            background: transparent;
            box-shadow: 0 0 10px #6d0571;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            background-image: linear-gradient(to right, #f4c4e2 0%, #6d0571 75%);
            color: whitesmoke;
            outline: none;
            border: none;
            border-radius: 40px;
            transition: 0.5s;
        }
        .wrapper .btn:hover {
            opacity: 50%;
        }
        .wrapper .btn:active {
            margin: 20px 0 15px;
            font-size: 14.6px;
            text-align: center;
        }
        .login_link p a {
            color: #000000;
            text-transform: uppercase;
            font-weight: bold;
            text-decoration: none;
        }
        .login_link p a:hover {
            text-decoration: underline;
            color: #6d0571;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <form id="registrationForm">
            <h1>Register</h1>
            <div class="inputBox">
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="inputBox">
                <input type="email" id="email" placeholder="Email" required>
            </div>
            <div class="inputBox">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <div class="inputBox">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            </div>
            <button type="submit" class="btn">Register</button>
            <div class="login_link">
                <p>Already have an account? <a href="login page.html">Login here</a></p>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            const registerData = { username, email, password };

            try {
                const response = await fetch('http://localhost:5000/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(registerData)
                });
                const result = await response.json();
                if (result.success) {
                    window.location.href = 'login page.html'; // Redirect to login page
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred. Please try again later.');
            }
        });
    </script>
</body>
</html>
