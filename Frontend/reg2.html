<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Details</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('../Login/img6.jpg');
            background-size: cover;
            background-position: center;
            color: #000;
        }
        .form-container {
            width: 500px;
            padding: 20px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }
        h2 {
            text-align: center;
            color: #6d0571;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #6d0571;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #f4c4e2;
        }
        .bmi-result, .goal-prediction {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Your Fitness Details</h2>
    <form id="fitness-form">
        <div class="input-group">
            <label for="gender">Gender</label>
            <select id="gender" required>
                <option value="">Select your gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="input-group">
            <label for="age">Age</label>
            <select id="age" required>
                <option value="">Select your age group</option>
                <option value="<20">Under 20</option>
                <option value="20-30">20-30</option>
                <option value="30-40">30-40</option>
                <option value="41-50">41-50</option>
                <option value=">50">Above 50</option>
            </select>
        </div>

        <div class="input-group">
            <label for="motivation">What motivates you most?</label>
            <select id="motivation" required>
                <option value="">Select your motivation</option>
                <option value="Lose weight">Lose weight</option>
                <option value="Get toned">Get toned</option>
                <option value="Get healthier">Get healthier</option>
                <option value="Feel happier">Feel happier</option>
            </select>
        </div>

        <div class="input-group">
            <label for="goal">Fitness Goal</label>
            <select id="goal" required>
                <option value="">Select your fitness goal</option>
                <option value="Weight loss">Weight loss</option>
                <option value="Muscle gain">Muscle gain</option>
                <option value="Endurance">Endurance</option>
                <option value="General fitness">General fitness</option>
            </select>
        </div>

        <div class="input-group">
            <label for="height">Height (in cm)</label>
            <input type="number" id="height" placeholder="Enter your height" required>
        </div>

        <div class="input-group">
            <label for="weight">Current Weight (in kg)</label>
            <input type="number" id="weight" placeholder="Enter your current weight" required>
        </div>

        <div class="input-group">
            <label for="goalWeight">Goal Weight (in kg)</label>
            <input type="number" id="goalWeight" placeholder="Enter your goal weight" required>
        </div>

        <div class="input-group">
            <label for="activity">How active are you?</label>
            <select id="activity" required>
                <option value="">Select your activity level</option>
                <option value="Not much">Not much</option>
                <option value="1-2 days per week">1-2 days per week</option>
                <option value="3-5 days per week">3-5 days per week</option>
                <option value="Daily">Daily</option>
            </select>
        </div>

        <button type="button" class="btn" onclick="calculateBMI()">Predict</button>

        <div class="bmi-result" id="bmiResult"></div>
        <div class="goal-prediction" id="goalPrediction"></div>
    </form>
</div>

<script>
    function calculateBMI() {
        const height = document.getElementById('height').value / 100;
        const weight = document.getElementById('weight').value;
        const goalWeight = document.getElementById('goalWeight').value;
        const activity = document.getElementById('activity').value;

        if (height > 0 && weight > 0) {
            const bmi = (weight / (height * height)).toFixed(2);
            let healthStatus = '';

            if (bmi < 18.5) {
                healthStatus = 'Underweight';
            } else if (bmi >= 18.5 && bmi <= 24.9) {
                healthStatus = 'Healthy';
            } else if (bmi >= 25 && bmi <= 29.9) {
                healthStatus = 'Overweight';
            } else {
                healthStatus = 'Obese';
            }

            document.getElementById('bmiResult').innerHTML = Your BMI is: ${bmi} (${healthStatus});

            const predictionDate = calculateGoalDate(goalWeight, weight, activity);
            document.getElementById('goalPrediction').innerHTML = You are likely to reach your goal weight by: ${predictionDate};
        }
    }

    function calculateGoalDate(goalWeight, currentWeight, activity) {
        let monthsToGoal = 0;
        const weightDifference = currentWeight - goalWeight;

        if (weightDifference <= 0) {
            return 'Already at goal!';
        }

        switch (activity) {
            case 'Not much':
                monthsToGoal = weightDifference / 0.5; // Losing 0.5kg per month
                break;
            case '1-2 days per week':
                monthsToGoal = weightDifference / 1; // Losing 1kg per month
                break;
            case '3-5 days per week':
                monthsToGoal = weightDifference / 2; // Losing 2kg per month
                break;
            case 'Daily':
                monthsToGoal = weightDifference / 3; // Losing 3kg per month
                break;
        }

        const goalDate = new Date();
        goalDate.setMonth(goalDate.getMonth() + Math.ceil(monthsToGoal));
        return goalDate.toLocaleDateString();
    }
</script>

</body>
</html>
