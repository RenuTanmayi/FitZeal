<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitZeal Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Basic styles */
        body {
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .profile-container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
            text-align: center;
        }
        .profile-container h2 {
            color: #b31166;
        }
        .profile-details {
            font-size: 1.2em;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <h2>Welcome to FitZeal!</h2>
        <!-- Display User Information -->
        <div id="userProfile">
            <!-- Username and other details will be displayed here -->
        </div>
    </div>

    <script>
        // Simulating a logged-in user's profile information (In real apps, fetch from backend)
        const user = {
            username: "renu_7755",
            fullName: "Renu Tanmayi",
            email: "abcd@gmail.com",
            avatar: "https://randomuser.me/api/portraits/men/1.jpg" // Placeholder avatar
        };

        // Function to display user details
        function displayUserProfile() {
            const profileContainer = document.getElementById('userProfile');
            profileContainer.innerHTML = `
                <img src="${user.avatar}" alt="Profile Avatar" class="rounded-circle" width="100" height="100">
                <div class="profile-details">
                    <p><strong>Username:</strong> ${user.username}</p>
                    <p><strong>Full Name:</strong> ${user.fullName}</p>
                    <p><strong>Email:</strong> ${user.email}</p>
                </div>
            `;
        }

        // Display the user profile on page load
        window.onload = displayUserProfile;
    </script>

</body>
</html>
