<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Intake Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .form-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            width: 400px;
            margin: 0 auto;
        }
        .form-container input, .form-container select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .form-container button {
            background-color: #6a4caf;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .form-container button:hover {
            background-color: #5a3d9e;
        }
        .meal-list {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Track Your Food Intake</h2>
        <form id="food-form">
            <label for="meal-type">Meal Type</label>
            <select id="meal-type" required>
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Dinner">Dinner</option>
                <option value="Snack">Snack</option>
            </select>

            <label for="food-item">Food Item</label>
            <input type="text" id="food-item" placeholder="e.g., Chicken Sandwich" required>

            <label for="serving-size">Serving Size</label>
            <input type="text" id="serving-size" placeholder="e.g., 1 sandwich" required>

            <label for="calories">Calories per Serving</label>
            <input type="number" id="calories" placeholder="e.g., 350" required>

            <button type="submit">Add Meal</button>
        </form>

        <div class="meal-list" id="meal-list">
            <h3>Meals Logged:</h3>
            <ul id="meal-list-ul"></ul>
        </div>
    </div>

    <script>
        // Handle form submission
        document.getElementById('food-form').addEventListener('submit', function(event) {
            event.preventDefault();

            const mealType = document.getElementById('meal-type').value;
            const foodItem = document.getElementById('food-item').value;
            const servingSize = document.getElementById('serving-size').value;
            const calories = document.getElementById('calories').value;

            const mealListUl = document.getElementById('meal-list-ul');

            // Create a new list item to display
            const li = document.createElement('li');
            li.textContent = `${mealType}: ${foodItem} (${servingSize}) - ${calories} calories`;
            
            // Append the item to the list
            mealListUl.appendChild(li);

            // Clear the form after submission
            document.getElementById('food-form').reset();
        });
    </script>

</body>
</html>
