<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Recommender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: white;
            color: #333;
        }
        .container {
            margin-top: 20px;
        }
        .recipe {
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Recipe Recommender</h1>
        <form id="ingredientForm">
            <div class="mb-3">
                <label for="ingredients" class="form-label">Enter Ingredients (comma separated)</label>
                <input type="text" class="form-control" id="ingredients" placeholder="e.g., chicken, rice, broccoli">
            </div>
            <button type="submit" class="btn btn-primary">Get Recipes</button>
        </form>

        <div id="recipeRecommendations" class="mt-4"></div>
    </div>

    <script>
        const recipes = [
            {
                id: 1,
                name: "Chicken Stir Fry",
                ingredients: ["chicken", "broccoli", "soy sauce", "rice"],
                instructions: "Cook chicken and broccoli in soy sauce, serve with rice."
            },
            {
                id: 2,
                name: "Vegetable Soup",
                ingredients: ["carrot", "onion", "broccoli", "vegetable broth"],
                instructions: "Boil all ingredients together and serve hot."
            },
            {
                id: 3,
                name: "Chicken Salad",
                ingredients: ["chicken", "lettuce", "tomato", "cucumber"],
                instructions: "Mix all ingredients and dress with olive oil."
            }
        ];

        document.getElementById("ingredientForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const userIngredients = document.getElementById("ingredients").value
                .split(',')
                .map(ing => ing.trim().toLowerCase());

            console.log("User Ingredients: ", userIngredients); // Debugging line

            const recommendations = findRecipes(userIngredients);
            displayRecommendations(recommendations);
        });

        function findRecipes(userIngredients) {
            // Find recipes that contain at least one of the user-provided ingredients
            return recipes.filter(recipe => 
                recipe.ingredients.some(ing => userIngredients.includes(ing))
            );
        }

        function displayRecommendations(recipes) {
            const recommendationsDiv = document.getElementById("recipeRecommendations");
            recommendationsDiv.innerHTML = ""; // Clear previous recommendations

            if (recipes.length === 0) {
                recommendationsDiv.innerHTML = "<p>No recipes found for the given ingredients.</p>";
                return;
            }

            recipes.forEach(recipe => {
                const recipeDiv = document.createElement("div");
                recipeDiv.className = "recipe";
                recipeDiv.innerHTML = `<h5>${recipe.name}</h5>
                                       <p>Ingredients: ${recipe.ingredients.join(', ')}</p>
                                       <p>Instructions: ${recipe.instructions}</p>`;
                recommendationsDiv.appendChild(recipeDiv);
            });
        }
    </script>
</body>
</html>
