<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url(image3.webp);
            background-size:cover;
            background-position: center;
        }
        .wrapper{
            width: 450px;
         
            padding: 80px 40px;
            border: 2px solid #dbd6d6;
            background: transparent;
            backdrop-filter: blur(30px);
            box-shadow: 0 0 10px #f9f8f8;
            border-radius: 10px;
        }
        .wrapper h1{
            font-size: 36px;
            color: #6d0571;
            font-weight: bolder;
            text-align: center;
            text-transform: uppercase;
        }
        .wrapper .inputBox{
            position: relative;
            height: 50px;
            width: 100%;
            margin: 20px 0;
        }
        .inputBox input{
            width: 100%;
            height: 100%;
            background: transparent;
            border: 2px solid #000000;
            outline: none;
            border-radius: 40px;
            font-size: 16px;
            color: #000000;
            padding: 20px;
            transition: all 0.4s;
        }
        .inputBox input::placeholder{
            color: #000000;
        }
        .inputBox input:focus{
            border: 2px solid rgba(245, 249, 252, 0.934);
        }
        .remember_forget{
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin: 15px 15px 20px;
        }
        .remember_forget label input{
            color: #fff;
            margin-right: 3px;
        }
        .remember_forget a{
            color: #000000;
            text-decoration: none;
        }
        .remember_forget a:hover{
            text-decoration: underline;
            color: #fff;
        }
        .wrapper .btn{
            width: 100%;
            height: 45px;
            background: transparent;
            box-shadow: 0 0 10px #6d0571;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
          
            background-image: linear-gradient(to right, #f4c4e2 0%, #6d0571 75%);
            color: whitesmoke;
            outline: none;
            border: none;
            border-radius: 40px;
            transition: 0.5s;

            transition: all 0.2s;
            transform: translateY(-5px);
        }
        .wrapper .btn:hover{
            background-position: left center;
            opacity: 50%;
           
        }
        .wrapper .btn:active{
            margin: 20px 0 15px;
            font-size: 14.6px;
            text-align: center;
        }
        .register_link p a{
            margin-left: 5px;
            color: #b5b8ba;
            text-transform: uppercase;
            font-weight: bold;
            text-decoration: none;
        }
        .register_link p a:hover{
            text-decoration: underline;
        }
        .checkbox{
            border:1px solid #6d0571;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <form action="">
            <h1>Login</h1>
            <div class="inputBox">
                <input type="text" placeholder="Username" required>
            </div>
            <div class="inputBox">
                <input type="password" placeholder="Password" required>
            </div>
            <div class="remember_forget"> 
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="btn">Login</button>
            <div class="register_link">
                <p>Don't have an account?<a href="#"> Register here</a></p>
            </div>
        </form>
    </div>
</body>
</html>
