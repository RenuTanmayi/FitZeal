<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitzeal Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Custom Light Orchid Theme for Navbar */
        .navbar {
            background-color: #E6A8D7; /* Light Orchid color */
        }
        .navbar .navbar-brand,
        .navbar .nav-link {
            color: white !important;
        }
        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            color: #F7D1E9 !important; /* Slightly lighter orchid on hover */
        }
        
        /* Icon Styling */
        .icon {
            color: white;
            font-size: 20px;
            margin-left: 15px;
        }

        /* Carousel Styling */
        .carousel-container {
            margin: 20px;
            border: 2px solid #E6A8D7;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .carousel-item {
            position: relative;
            height: 300px; /* Adjust height as needed */
        }
        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(50%);
        }
        .carousel-caption {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
        }
        .carousel-caption h2 {
            font-size: 24px;
            font-weight: bold;
        }

        /* Section Container Styling */
        .section-container {
            display: flex;
            justify-content: space-between;
            margin: 20px;
        }
        .section {
            flex: 1;
            margin: 0 10px; /* Space between sections */
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            position: relative;
            height: 150px; /* Set height for sections */
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.5); /* Dark overlay */
        }
        .section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(30%);
        }
        .section h3 {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
        }
        .section a {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background-color: #E6A8D7;
            border-radius: 20px;
            font-size: 14px;
        }
        .section a:hover {
            background-color: #F7D1E9;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Fitzeal</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Dropdown
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <a href="#" class="icon" aria-label="Search">
                        <i class="fas fa-search"></i>
                    </a>
                    <a href="#" class="icon" aria-label="Notifications">
                        <i class="fas fa-bell"></i>
                    </a>
                    <div class="dropdown">
                        <a href="#" class="icon dropdown-toggle" id="profileDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Profile">
                            <i class="fas fa-user-circle"></i>
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="profileDropdown">
                            <li><a class="dropdown-item" href="#">Username</a></li>
                            <li><a class="dropdown-item" href="#">Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Carousel Section -->
    <div class="carousel-container">
        <div id="fitzealCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="water.jpeg" alt="Water Intake">
                    <div class="carousel-caption">
                        <h2>Water Intake</h2>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="food-intake.jpg" alt="Food Intake">
                    <div class="carousel-caption">
                        <h2>Food Intake</h2>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="sleep-tracking.jpg" alt="Sleep Tracking">
                    <div class="carousel-caption">
                        <h2>Sleep Tracking</h2>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="exercise-tracking.jpg" alt="Exercise Tracking">
                    <div class="carousel-caption">
                        <h2>Exercise Tracking</h2>
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#fitzealCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#fitzealCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>

    <!-- Small Section Containers -->
    <div class="section-container">
        <div class="section">
            <img src="water.jpeg" alt="Water Intake">
            
            <a href="water-intake.html">Go to Water Intake</a>
        </div>
        <div class="section">
            <img src="food-intake.jpg" alt="Food Intake">
            
            <a href="food-intake.html">Go to Food Intake</a>
        </div>
        <div class="section">
            <img src="sleep-tracking.jpg" alt="Sleep Tracking">
           
            <a href="sleep-tracking.html">Go to Sleep Tracking</a>
        </div>
        <div class="section">
            <img src="exercise-tracking.jpg" alt="Exercise Tracking">
            
            <a href="exercise-tracking.html">Go to Exercise Tracking</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
