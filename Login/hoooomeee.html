<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitzeal Home</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Basic styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background: white;
            color: #333;
            padding-top: 70px;
        }

        /* Header styling */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background-color: #844586;
            color: white;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        .header h1 {
            font-size: 24px;
            font-weight: bold;
        }
        .header .search-bar {
            flex-grow: 0.5;
            margin: 0 15px;
        }
        .header input[type="text"] {
            width: 100%;
            padding: 5px;
            border-radius: 5px;
            border: none;
            font-size: 14px;
        }
        .header-icons {
            display: flex;
            align-items: center;
        }
        .header-icons .icon {
            margin: 0 10px;
            cursor: pointer;
        }
        .profile-icon {
            position: relative;
        }
        .profile-dropdown {
            display: none;
            position: absolute;
            top: 35px;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
            width: 120px;
            text-align: center;
        }
        .profile-dropdown a {
            display: block;
            padding: 10px;
            color: #333;
            text-decoration: none;
            font-size: 14px;
        }
        .profile-dropdown a:hover {
            background-color: #f4c4e2;
        }
        .profile-icon:hover .profile-dropdown {
            display: block;
        }

        /* Section Grid */
        .section-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            padding: 20px;
            max-width: 1200px;
            max-height: 650px;
            margin: auto;
        }
        .section {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
        .section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(50%);
        }
        .section .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
        }
        .section-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
        }
        .section-content a {
            color: white;
            text-decoration: none;
           
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 16px;
        }
        .section-content a:hover {
            background: #f4c4e2;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1>Fitzeal</h1>
        <div class="search-bar">
            <input type="text" placeholder="Search...">
        </div>
        <div class="header-icons">
            <span class="icon">🔔</span>
            <div class="profile-icon">
                <span class="icon">👤</span>
                <div class="profile-dropdown">
                    <a href="#">Username</a>
                    <a href="#">Settings</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Sections for each tracking page -->
    <div class="section-container">
        <div class="section">
            <img src="water.jpeg" alt="Water Intake">
            <div class="overlay"></div>
            <div class="section-content">
                <h2>Water Intake</h2>
                <a href="water-intake.html">Go to Water Intake</a>
            </div>
        </div>
        <div class="section">
            <img src="food-intake.jpg" alt="Food Intake">
            <div class="overlay"></div>
            <div class="section-content">
                <h2>Food Intake</h2>
                <a href="food-intake.html">Go to Food Intake</a>
            </div>
        </div>
        <div class="section">
            <img src="sleep-tracking.jpg" alt="Sleep Tracking">
            <div class="overlay"></div>
            <div class="section-content">
                <h2>Sleep Tracking</h2>
                <a href="sleep-tracking.html">Go to Sleep Tracking</a>
            </div>
        </div>
        <div class="section">
            <img src="exercise-tracking.jpg" alt="Exercise Tracking">
            <div class="overlay"></div>
            <div class="section-content">
                <h2>Exercise Tracking</h2>
                <a href="exercise-tracking.html">Go to Exercise Tracking</a>
            </div>
        </div>
    </div>

</body>
</html>
