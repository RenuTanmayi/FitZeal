<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Forgot Password</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items:center;
            min-height: 100vh;
            background: url(../Login/img6.jpg);
            background-size: cover;
            background-position: center;
        }
        .wrapper {
            width: 450px;
            padding: 80px 40px;
            border: 2px solid #dbd6d6;
            background: transparent;
            backdrop-filter: blur(30px);
            box-shadow: 0 0 10px #f9f8f8;
            border-radius: 10px;
        }
        .wrapper h1 {
            font-size: 36px;
            color: #6d0571;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
        }
        .inputBox {
            position: relative;
            height: 50px;
            width: 100%;
            margin: 20px 0;
        }
        .inputBox input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: 2px solid #000000;
            outline: none;
            border-radius: 40px;
            font-size: 16px;
            color: #000000;
            padding: 20px;
        }
        .inputBox input::placeholder {
            color: #000000;
        }
        .wrapper .btn {
            width: 100%;
            height: 45px;
            background: transparent;
            box-shadow: 0 0 10px #6d0571;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            background-image: linear-gradient(to right, #f4c4e2 0%, #6d0571 75%);
            color: whitesmoke;
            outline: none;
            border: none;
            border-radius: 40px;
            transition: 0.5s;
        }
        .wrapper .btn:hover {
            opacity: 50%;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <form action="">
            <h1>Reset Password</h1>
            <div class="inputBox">
                <input type="email" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="btn">Send Reset Link</button>
        </form>
    </div>
</body>
</html>
